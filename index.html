<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSE 6332 image gallery project">
  <title>Visual Stories | CSE 6332</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Page heading -->
  <header class="site-header">
    <p class="eyebrow">CSE 6332</p>
    <h1>Image Gallery</h1>
    <p class="intro">A curated gallery of twelve images and the stories behind them.</p>
    <p id="count" class="count" aria-live="polite"></p>
  </header>

  <!-- Image cards are added by script.js -->
  <main class="main-content">
    <section id="gallery" class="gallery" aria-label="Image gallery"></section>
  </main>

  <!-- Enlarged image viewer -->
  <dialog id="viewer" class="viewer" aria-label="Image viewer">
    <button id="close" class="viewer-close" type="button" aria-label="Close image viewer">&times;</button>
    <img id="large" class="viewer-image" alt="">
    <p id="viewer-caption" class="viewer-caption"></p>
  </dialog>

  <footer class="site-footer">Image Gallery · CSE 6332</footer>
</body>
</html>
